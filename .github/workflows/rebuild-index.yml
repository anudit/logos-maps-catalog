name: Rebuild index

# Regenerates the rolling `index` release (index.json — the catalog
# clients fetch) whenever a per-module release fires the
# `rebuild-index` repository_dispatch event. Also runs on a six-hourly
# schedule as a catch-up so a missed dispatch can't strand the catalog,
# and can be kicked manually from the Actions UI.
#
# Thin passthrough to the versioned action — nothing to configure here.

on:
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]
  schedule:
    - cron: '17 */6 * * *'

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  rebuild:
    uses: logos-co/logos-modules-release-action/.github/workflows/rebuild-index.yml@v1
    with:
      # Unset means GitHub-hosted; see "Runners and the Nix cache" in the README.
      runner: ${{ vars.RELEASE_RUNNER }}

  mirror:
    needs: rebuild
    runs-on: ubuntu-latest
    concurrency:
      group: publish-catalog-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mirror generated index and icons
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p catalog
          gh release download index --repo "$GITHUB_REPOSITORY" --dir catalog --clobber
          python3 -c 'import json; from pathlib import Path; x=json.loads(Path("catalog/index.json").read_text()); assert isinstance(x.get("packages"), list)'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update generated catalog mirror'
          git pull --rebase origin main
          git push origin HEAD:main
